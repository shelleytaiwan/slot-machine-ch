<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>句型拉霸机</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#d81f26; --red-dark:#9c1116; --red-light:#ff5a52;
    --black:#151515; --panel:#1c1c1c; --panel2:#262626;
    --yellow:#ffd200; --yellow-deep:#f59e0b; --gold:#ffe57a;
    --cream:#fff8e7;
    --cell-h:150px;
    --font:'Baloo 2','Noto Sans TC',system-ui,sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:var(--font);
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:18px;
    background:
      radial-gradient(circle at 50% 0%, #3a3a3a 0%, #222 38%, #111 100%);
    overflow-x:hidden;
    user-select:none; -webkit-user-select:none;
  }
  /* floor */
  body::after{
    content:""; position:fixed; left:0; right:0; bottom:0; height:30vh;
    background:linear-gradient(#5a3a22,#3a2415);
    box-shadow:inset 0 14px 30px rgba(0,0,0,.55);
    z-index:-1;
  }

  .stage{ width:min(97vw,1500px); display:flex; flex-direction:column; align-items:center; gap:14px; }

  /* ============ THE MACHINE ============ */
  .machine{
    position:relative;
    width:100%;
    background:
      linear-gradient(180deg,var(--red-light) 0%, var(--red) 14%, var(--red) 80%, var(--red-dark) 100%);
    border-radius:34px 34px 30px 30px;
    padding:clamp(14px,2vw,28px);
    box-shadow:
      inset 0 4px 0 rgba(255,255,255,.35),
      inset 0 -12px 24px rgba(0,0,0,.4),
      0 28px 60px rgba(0,0,0,.6);
    border:4px solid #7e0e12;
  }
  /* screws */
  .screw{position:absolute;width:16px;height:16px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff,#bbb 40%,#666);
    box-shadow:0 2px 3px rgba(0,0,0,.5);}
  .screw::after{content:"";position:absolute;inset:5px;border-top:2px solid #555;transform:rotate(40deg);}
  .screw.tl{top:12px;left:12px} .screw.tr{top:12px;right:12px}
  .screw.bl{bottom:12px;left:12px} .screw.br{bottom:12px;right:12px}

  /* marquee bulbs */
  .bulbs{display:flex; justify-content:space-between; padding:0 10px 10px;}
  .bulbs span{width:clamp(10px,1.4vw,16px); height:clamp(10px,1.4vw,16px); border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 10px var(--gold),0 0 18px var(--yellow-deep);
    animation:flash 1s infinite;}
  .bulbs span:nth-child(odd){animation-delay:.5s;}

  @keyframes flash{0%,49%{opacity:1}50%,100%{opacity:.25}}

  /* header */
  .header{
    background:linear-gradient(#101010,#262626);
    border:3px solid var(--yellow);
    border-radius:20px;
    padding:clamp(8px,1.6vw,18px) 20px;
    display:flex; align-items:center; justify-content:center; gap:14px;
    box-shadow:inset 0 0 28px rgba(255,210,0,.18);
    margin-bottom:14px;
  }
  .header .star{color:var(--yellow); font-size:clamp(22px,4vw,48px); text-shadow:0 0 14px var(--yellow-deep);}
  .header h1{
    color:#fff; font-weight:800; letter-spacing:.06em;
    font-size:clamp(30px,6.4vw,76px); line-height:1;
    text-shadow:0 3px 0 var(--red-dark), 0 0 22px rgba(255,210,0,.35);
  }

  /* stats */
  .stats{
    display:flex; justify-content:center; gap:clamp(20px,6vw,90px);
    background:#0c0c0c; border-radius:16px;
    padding:clamp(6px,1.2vw,12px) 16px; margin-bottom:14px;
    border:2px solid #3a3a3a;
  }
  .stat{display:flex; flex-direction:column; align-items:center; line-height:1;}
  .stat .ico{font-size:clamp(16px,2.4vw,26px);}
  .stat .num{color:var(--yellow); font-weight:800; font-size:clamp(22px,4vw,46px); text-shadow:0 0 12px var(--yellow-deep);}
  .stat .lbl{color:#888; font-size:clamp(10px,1.4vw,15px); font-weight:700; margin-top:2px;}

  /* reels */
  .reel-frame{
    background:#0a0a0a;
    border:clamp(5px,1vw,11px) solid var(--yellow);
    border-radius:22px;
    padding:clamp(8px,1.4vw,18px);
    box-shadow:inset 0 0 40px rgba(0,0,0,.9), 0 0 0 3px #b88600;
  }
  .reels{display:flex; gap:clamp(5px,.9vw,12px);}
  .reel{
    flex:1 1 0; min-width:0;
    height:var(--cell-h);
    background:linear-gradient(180deg,#fff7d6,#ffd84a 45%,#ffc91f 55%,#fff7d6);
    border-radius:12px;
    overflow:hidden; position:relative;
    box-shadow:inset 0 0 0 3px #d49a00, inset 0 14px 18px rgba(0,0,0,.18), inset 0 -14px 18px rgba(0,0,0,.18);
  }
  /* shine */
  .reel::before{content:""; position:absolute; inset:0; pointer-events:none; z-index:3;
    background:linear-gradient(180deg, rgba(255,255,255,.55), transparent 22%, transparent 78%, rgba(0,0,0,.18));}
  .strip{position:absolute; left:0; right:0; top:0; will-change:transform;}
  .cell{
    height:var(--cell-h); display:flex; align-items:center; justify-content:center;
    text-align:center; padding:0 4px;
    color:#1a1a1a; font-weight:900; white-space:nowrap;
    font-size:clamp(34px,5.6vw,70px); line-height:1;
    text-shadow:0 2px 0 rgba(255,255,255,.5);
  }
  .cell.s3{font-size:clamp(28px,4.4vw,54px);}
  .cell.s4{font-size:clamp(22px,3.4vw,42px);}
  .cell.s5{font-size:clamp(18px,2.8vw,34px);}
  .reel.spinning .strip{filter:blur(1.2px);}

  .reel-labels{display:flex; gap:clamp(5px,.9vw,12px); margin-top:8px;}
  .reel-labels div{flex:1 1 0; text-align:center; color:var(--gold);
    font-size:clamp(10px,1.5vw,17px); font-weight:700; letter-spacing:.02em;}

  /* sentence banner */
  .banner{
    margin-top:14px;
    background:linear-gradient(#0e0e0e,#222);
    border:3px solid var(--yellow);
    border-radius:18px;
    min-height:clamp(70px,11vw,120px);
    display:flex; align-items:center; justify-content:center; gap:12px;
    padding:clamp(10px,2vw,22px);
    box-shadow:inset 0 0 30px rgba(255,210,0,.15);
  }
  .banner #sentence{
    color:var(--yellow);
    font-weight:800; text-align:center; line-height:1.25;
    font-size:clamp(24px,4.2vw,56px);
    text-shadow:0 2px 0 #7a4a00, 0 0 18px rgba(255,210,0,.4);
  }
  .banner.idle #sentence{color:#ffcf33; opacity:.92;}
  .banner.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1);}
  @keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.06)}100%{transform:scale(1)}}

  /* ============ LEVER ============ */
  .lever-zone{
    position:absolute; top:18%; right:clamp(-30px,-2.4vw,-44px);
    width:clamp(72px,8.2vw,132px); height:64%;
    z-index:5; cursor:pointer; touch-action:none;
  }
  .lever-base{
    position:absolute; bottom:0; left:50%; transform:translateX(-50%);
    width:clamp(40px,4.6vw,70px); height:clamp(40px,4.6vw,70px); border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#777,#2a2a2a);
    box-shadow:0 6px 12px rgba(0,0,0,.6), inset 0 2px 4px rgba(255,255,255,.3);
    border:3px solid #111;
  }
  .lever-arm{
    position:absolute; bottom:clamp(16px,2vw,28px); left:50%;
    transform-origin:bottom center;
    transition:transform .18s cubic-bezier(.34,1.56,.64,1);
  }
  .lever-stick{
    width:clamp(14px,1.7vw,23px); height:clamp(172px,25vw,340px);
    margin-left:calc(clamp(14px,1.7vw,23px) / -2);
    background:linear-gradient(90deg,#444,#999 45%,#444);
    border-radius:14px;
    box-shadow:0 0 0 2px #222, 0 4px 8px rgba(0,0,0,.4);
  }
  .lever-ball{
    position:absolute; top:clamp(-50px,-5.8vw,-80px); left:50%; transform:translateX(-50%);
    width:clamp(54px,6.4vw,96px); height:clamp(54px,6.4vw,96px); border-radius:50%;
    background:radial-gradient(circle at 32% 28%,#ff7b73,var(--red) 55%,#8e0d12);
    box-shadow:0 8px 16px rgba(0,0,0,.5), inset 0 4px 8px rgba(255,255,255,.45);
    border:3px solid #6e0a0e;
  }
  .lever-zone.pulled .lever-arm{transform:translateX(-50%) rotate(118deg);}
  .lever-hint{
    position:absolute; bottom:-26px; left:50%; transform:translateX(-50%);
    color:var(--gold); font-weight:800; white-space:nowrap;
    font-size:clamp(16px,2.1vw,28px); text-shadow:0 2px 6px #000;
    animation:bob 1.1s ease-in-out infinite;
  }
  @keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-6px)}}

  /* ============ CONTROLS ============ */
  .controls{display:flex; flex-wrap:wrap; gap:12px; justify-content:center;}
  .btn{
    font-family:var(--font); font-weight:800; cursor:pointer;
    border:none; border-radius:16px;
    padding:clamp(12px,1.6vw,18px) clamp(20px,3vw,40px);
    font-size:clamp(18px,2.6vw,30px);
    color:#fff; transition:transform .1s, filter .15s;
    box-shadow:0 6px 0 rgba(0,0,0,.35), 0 8px 16px rgba(0,0,0,.3);
  }
  .btn:active{transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.35);}
  .btn.spin{background:linear-gradient(#ffd200,#f59e0b); color:#7a1a00; text-shadow:0 1px 0 #fff6;}
  .btn.say{background:linear-gradient(#e23b3b,#b51d22);}
  .btn.mute{background:linear-gradient(#3a3a3a,#222);}
  .btn:disabled{filter:grayscale(.6) brightness(.8); cursor:not-allowed;}

  .hint{color:#bbb; font-size:clamp(12px,1.6vw,16px); text-align:center; font-weight:600;}
  .hint b{color:var(--yellow);}
</style>
</head>
<body>
<div class="stage">
  <div class="machine" id="machine">
    <span class="screw tl"></span><span class="screw tr"></span>
    <span class="screw bl"></span><span class="screw br"></span>

    <div class="bulbs" id="bulbsTop"></div>

    <div class="header">
      <span class="star">✦</span>
      <h1>句型拉霸机</h1>
      <span class="star">✦</span>
    </div>

    <div class="reel-frame">
      <div class="reels" id="reels"></div>
      <div class="reel-labels" id="reelLabels"></div>
    </div>

    <div class="banner idle" id="banner">
      <div id="sentence">⋯⋯⋯</div>
    </div>

    <!-- Lever -->
    <div class="lever-zone" id="lever">
      <div class="lever-arm">
        <div class="lever-stick"></div>
        <div class="lever-ball"></div>
      </div>
      <div class="lever-base"></div>
      <div class="lever-hint">↓ 拉我 ↓</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn say" id="btnSay">🔊 再念一次</button>
    <button class="btn mute" id="btnMute">🔈 语音：开</button>
  </div>
</div>

<script>
/* ===================== 七组词汇 ===================== */
const GROUPS = [
  { label:"语气",     words:["太好了！","天啊！","完了！","完蛋了！","蛤？！","我的妈呀！","什么？！","不会吧？！","oh oh！","真假！","你知道吗！","听说","我的天啊！","好离谱！","太扯了！","烦死了","惨了惨了！","真烦人","老师说","我妈妈说","你看新闻了吗？","哇靠！","不会吧！","不是吧！","真受不了"] },
  { label:"是谁",     words:["老师","警察","校长","爸爸","妈妈","我朋友","老师们","学生们","老板娘","小狗","大家","董事长","总经理","主任","老板","黑道大哥","司机","管理员","警卫","组长","我同学","医生"] },
  { label:"什么时候", words:["昨天","今天","早上","半夜","上个月","冬天","夏天","上课时","下课后","上课前","回家后","小时候","无聊时","放学后","昨晚","去年","刚才","5分钟前","下午","备课时","工作时","上班时","下班后","上班前","加班时","加班后","放假时","过年时","跨年夜"] },
  { label:"在哪里",   words:["学校","游泳池","厕所","超市","车站前","班上","办公室","大卖场","家里","教室","浴室","超商里","电车里","厨房","公司","电影院","书店","101大楼","晴空塔","餐厅","百货公司","公园","体育场","居酒屋","夜市","面店","咖啡店","图书馆","全家","他家","我家","老师家","花园","草地上","森林里","云霄飞车上","游乐园","客厅","卧室","房间里"] },
  { label:"怎么样地", words:["一直","用力","偷偷地","开心地","高兴地","疯狂地","神秘地","生气地","不停地","努力","很有耐心地","认真地","兴奋地","热情地","仔细地","飞快地","慢慢地","和明星一起","和老板一起","和老师一起","边走边","边吃边","边跑边","悄悄地","拼命","不眠不休地","愤怒地","独自","默默地","使劲","咬牙","忍着痛","笑着","哭着","低着头","红着脸","闭着眼","流着泪"] },
  { label:"做什么",   words:["大叫","滑手机","玩游戏","做体操","跳街舞","唱歌","说英文","练高尔夫","备课","骂人","打人","亲亲","煮咖喱","练日语","画图","打电脑","打电话","自拍","照相","做包子","泡茶","发呆","睡觉","吃饭","打麻将","打牌","看动漫","扮装","表演","折纸","写书法","跑步","散步","炒股"] },
  { label:"语气",     words:["太棒了！","好惨！","超厉害！","太酷了！","超酷的！","神！","笑死！","傻眼！","超好笑！","好扯哦！","太夸张了！","真假！","没救了！","无语","好离谱哦！","超烦的！","超讨厌的！","好好玩哦！","哈哈哈","他有病吧！","好好笑！","酷！","太帅了！","佩服！","好猛！","太强了","疯了吧！","太神了！","帅炸了！","真的是！","哎！","笑烂！"] },
];

/* ===================== 工具 ===================== */
const $ = s => document.querySelector(s);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function sizeClass(w){const n=[...w].length; if(n<=2)return ""; if(n===3)return "s3"; if(n===4)return "s4"; return "s5";}
function makeCell(w){const d=document.createElement("div"); d.className="cell "+sizeClass(w); d.textContent=w; return d;}

/* 洗牌袋：每个词至少出现一次才会重复 */
const bags = GROUPS.map(()=>[]);
function draw(i){
  if(bags[i].length===0){
    let nb = shuffle(GROUPS[i].words);
    // 避免新一轮的第一个跟刚刚出现的最后一个相同
    if(GROUPS[i].words.length>1 && current[i] && nb[0]===current[i]){
      nb.push(nb.shift());
    }
    bags[i]=nb;
  }
  return bags[i].shift();
}

/* ===================== 建立转轮 ===================== */
const reelsEl=$("#reels"), labelsEl=$("#reelLabels");
const reelEls=[], stripEls=[];
const current = new Array(GROUPS.length).fill(null);

GROUPS.forEach((g,i)=>{
  const reel=document.createElement("div"); reel.className="reel";
  const strip=document.createElement("div"); strip.className="strip";
  // 初始随机显示一个词
  const init = g.words[Math.floor(Math.random()*g.words.length)];
  current[i]=init;
  strip.appendChild(makeCell(init));
  reel.appendChild(strip);
  reelsEl.appendChild(reel);
  reelEls.push(reel); stripEls.push(strip);

  const lab=document.createElement("div"); lab.textContent=g.label; labelsEl.appendChild(lab);
});

/* ===================== 拉霸动作 ===================== */
let spinning=false, lastSentence="", lastSpeech="";

function cellHeight(){ return reelEls[0].clientHeight; }

function spin(){
  if(spinning) return;
  spinning=true;

  // 解锁语音朗读：转轮动画结束后才会呼叫 speak()，那时已经离开使用者
  // 点击/拉杆的那个瞬间（是靠 transitionend 事件触发的），Safari（尤其
  // iOS）会判定那不是使用者操作而整段静音。这里趁着现在还在使用者手势
  // 当下，先同步发一个无声的 utterance「解锁」语音功能，之后 finish()
  // 里真正要念的那句才有机会正常出声。
  if('speechSynthesis' in window){
    try{
      const unlock=new SpeechSynthesisUtterance(' ');
      unlock.volume=0;
      speechSynthesis.speak(unlock);
    }catch(e){}
  }

  // 拉杆动画
  const lever=$("#lever"); lever.classList.add("pulled");
  setTimeout(()=>lever.classList.remove("pulled"),420);
  clickSound();

  const banner=$("#banner");
  banner.classList.remove("pop"); banner.classList.add("idle");
  $("#sentence").textContent="⋯⋯⋯";

  const H = cellHeight();
  const results = [];
  let done = 0;

  reelEls.forEach((reel,i)=>{
    const target = draw(i);
    results[i] = target;

    // 组装转动条：起点(目前词) + 一堆随机填充 + 目标词
    const strip = stripEls[i];
    strip.style.transition="none";
    strip.style.transform="translateY(0)";
    strip.innerHTML="";
    strip.appendChild(makeCell(current[i]));               // index 0 起点
    const fillN = 16 + i*5;                                  // 越右边转越久 → 阶梯停
    for(let k=0;k<fillN;k++){
      const r = GROUPS[i].words[Math.floor(Math.random()*GROUPS[i].words.length)];
      strip.appendChild(makeCell(r));
    }
    strip.appendChild(makeCell(target));                    // 最后一格 = 结果
    const lastIndex = fillN + 1;

    // 设定每格高度，确保对齐
    [...strip.children].forEach(c=>c.style.height=H+"px");

    reel.classList.add("spinning");

    // 启动转动
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      const dur = 1.15 + i*0.32;
      strip.style.transition=`transform ${dur}s cubic-bezier(.12,.7,.18,1)`;
      strip.style.transform=`translateY(${-lastIndex*H}px)`;

      const onEnd=()=>{
        strip.removeEventListener("transitionend",onEnd);
        reel.classList.remove("spinning");
        // 收尾：只留结果那一格，归零
        strip.style.transition="none";
        strip.innerHTML="";
        const c=makeCell(target); c.style.height=H+"px"; strip.appendChild(c);
        strip.style.transform="translateY(0)";
        current[i]=target;
        tickSound();
        done++;
        if(done===reelEls.length) finish(results);
      };
      strip.addEventListener("transitionend",onEnd);
    }));
  });
}

/* 产生包含自然停顿（逗号间隔）的语音文字 */
function buildSpeechWithPauses(rawSentence, wordsArray) {
  let [op, who, when, where, how, act, end] = wordsArray;
  
  // 语音发音优化 (只做必要的字词替换，不影响语音风格)
  op = fixOpening(op);
  how = fixAdverb(how);
  where = fixPlace(where);
  let endFixed = fixEnding(end);
  
  let parts = [];
  parts.push(op);
  let subjectTime = `${who}${when}`;
  parts.push(subjectTime);
  let placeAction = `在${where}${how}${act}`;
  parts.push(placeAction);
  parts.push(endFixed);
  
  let pausedSpeech = parts.join("，");
  pausedSpeech = pausedSpeech.replace(/！，/g, "！").replace(/？，/g, "？").replace(/。，/g, "。");
  if(!pausedSpeech.endsWith("。") && !pausedSpeech.endsWith("！") && !pausedSpeech.endsWith("？")){
    pausedSpeech += "。";
  }
  return pausedSpeech;
}

function finish(words){
  spinning=false;

  // 组句 (显示用)
  const [op,who,when,where,how,act,end] = words;
  const sentence = `${op}　${who}${when}在${where}${how}${act}，${end}`;
  
  const speechWithRhythm = buildSpeechWithPauses(sentence, words);
  
  lastSentence = sentence;
  lastSpeech = speechWithRhythm;

  const banner=$("#banner");
  banner.classList.remove("idle");
  $("#sentence").textContent=sentence;
  banner.classList.remove("pop"); void banner.offsetWidth; banner.classList.add("pop");

  winSound();
  speak(lastSpeech);
}

/* ===================== 语音（维持原 zh-TW 台湾腔，只改简字） ===================== */
let voiceOn=true, zhVoice=null;

function fixAdverb(w){ return w.replace(/地/g,"的"); }   
function fixOpening(w){ return w.replace(/蛤/g,"哈"); }  
function fixPlace(w){ return w.replace("101","一零一"); } 
function fixEnding(w){ 
  let fixed = w.replace(/哦/g,"喔");
  return fixed;
}

function pickVoice(){
  const vs=speechSynthesis.getVoices();
  // 优先保留台湾腔 zh-TW，完全不改成 zh-CN
  zhVoice = vs.find(v=>/zh-TW|zh_TW/i.test(v.lang))
         || vs.find(v=>/zh-HK/i.test(v.lang))
         || vs.find(v=>/^zh/i.test(v.lang))
         || vs.find(v=>/Chinese|中文|國語|普通话/i.test(v.name))
         || null;
}
if('speechSynthesis' in window){
  pickVoice();
  speechSynthesis.onvoiceschanged=pickVoice;
}

function speak(text){
  if(!voiceOn || !('speechSynthesis' in window)) return;
  if(!zhVoice) return; // 找不到中文语音就不出声，避免用错的语音乱念
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="zh-TW";   // 维持原台湾腔，不做任何改动
  u.voice=zhVoice;
  u.rate=0.92;
  u.pitch=1.08;
  u.volume=1;
  speechSynthesis.speak(u);
}

/* ===================== 音效（WebAudio） ===================== */
let actx=null;
function ac(){ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); return actx; }
function beep(freq,dur,type="square",vol=0.12,delay=0){
  try{const a=ac();const o=a.createOscillator(),g=a.createGain();
    o.type=type;o.frequency.value=freq;o.connect(g);g.connect(a.destination);
    const t=a.currentTime+delay;g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.start(t);o.stop(t+dur);}catch(e){}
}
function clickSound(){beep(180,0.08,"square",0.18);}
function tickSound(){beep(660,0.05,"square",0.10);}
function winSound(){[523,659,784,1046].forEach((f,i)=>beep(f,0.18,"triangle",0.16,i*0.09));}

/* ===================== 拉杆互动 ===================== */
const leverEl=$("#lever");
let dragStartY=null;
leverEl.addEventListener("pointerdown",e=>{ if(spinning)return; dragStartY=e.clientY; leverEl.classList.add("pulled"); leverEl.setPointerCapture(e.pointerId);});
leverEl.addEventListener("pointerup",e=>{
  leverEl.classList.remove("pulled");
  if(dragStartY!==null){ dragStartY=null; spin(); }
});
leverEl.addEventListener("pointercancel",()=>{leverEl.classList.remove("pulled");dragStartY=null;});

/* ===================== 按钮 / 键盘 ===================== */
$("#btnSay").addEventListener("click",()=>{ if(lastSpeech) speak(lastSpeech); });
$("#btnMute").addEventListener("click",e=>{
  voiceOn=!voiceOn;
  e.target.textContent = voiceOn ? "🔈 语音：开" : "🔇 语音：关";
  if(!voiceOn) speechSynthesis.cancel();
});
window.addEventListener("keydown",e=>{
  if(e.code==="Space"){ e.preventDefault(); spin(); }
});

  if(spinning) return;
